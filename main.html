<!DOCTYPE html>
<html lang="en">
<head>
    <title>AutoGMeet+</title>

    <link id="theme-style" rel="stylesheet" href="css/pink-mode.css">
</head>
<body>
    <img src="images/icon.png" alt="Logo">
    <h1>AutoGMeet+ <small id="app-version"></small></h1>
    <p>Google Chrome Extension for ones who love to focus and miss the meeting!</p>
    <div class="date-pill"><span class="span_date" id="today-date"></span></div>

    <section class="card">
      <h2 class="card-title">Appearance</h2>
      <label class="switch-row" for="mode-switch">
        <span class="row-label">Dark theme</span>
        <input type="checkbox" class="switch" id="mode-switch">
      </label>
      <label class="switch-row" for="mode-switch-auto">
        <span class="row-label">Inherit from Chrome</span>
        <input type="checkbox" class="switch" id="mode-switch-auto">
      </label>
    </section>

    <p></p>
    <label for="time-join-value">Join before: </label>
    <span id="time-join-value"></span>
    <label for="time-join">min.</label>
    <input type="range" id="time-join" min="-2" max="1">

    <button id="powerButton">Stop</button>

    <section class="card">
      <h2 class="card-title">Meeting providers</h2>
      <label class="switch-row" for="provider-meet">
        <span class="row-label">Google Meet</span>
        <input type="checkbox" class="switch" id="provider-meet" data-provider="meet">
      </label>
      <label class="switch-row" for="provider-zoom">
        <span class="row-label">Zoom</span>
        <input type="checkbox" class="switch" id="provider-zoom" data-provider="zoom">
      </label>
    </section>

    <div class="dropdown" id="meetDropdown">
      <div class="dropdown-header" id="dropdownHeader">
        Select Meeting Types
      </div>
      <div class="dropdown-panel" id="dropdownPanel">
        <label>
          <input type="checkbox" value="accepted" />
          Accepted Meetings
        </label>
        <label>
          <input type="checkbox" value="needsAction" />
          Pending Meetings
        </label>
        <label>
          <input type="checkbox" value="tentative" />
          Tentative Meetings
        </label>
        <label>
          <input type="checkbox" value="cancelled" />
          Declined Meetings
        </label>
      </div>
    </div>

    <script src="js/popup.js"></script>

</body>
</html>
